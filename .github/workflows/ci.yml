name: EduAI CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  neutral-brand:
    name: No single university baked into the product
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fail if a university's name appears in product code
        # Each university's name, logo and colours come from its own installation's settings.
        # Add a name here when a new customer is onboarded, so it never lands in the code.
        run: |
          if grep -rniIE "christ ?university|christuniversity" apps/*/src apps/*/index.html backend/apps backend/config .env.example apps/*/.env.example docker-compose.yml; then
            echo "Found a university's name in product code. Keep it in that installation's settings instead."
            exit 1
          fi

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DJANGO_DEBUG: "True"
      USE_SQLITE_FALLBACK: "True"
      REDIS_URL: ""
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run Django system checks
        run: python manage.py check

      - name: Run Django tests
        run: python manage.py test --verbosity 1

  frontend:
    name: Frontend - ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: eduai
            test: false
          - app: edugames
            test: true
          - app: teacherbuddy
            test: true
          - app: landing
            test: true
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend build
        run: npm run build

      - name: Run frontend tests
        if: matrix.test == true
        run: npm test -- --run
