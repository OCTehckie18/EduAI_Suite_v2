name: EduAI CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DJANGO_DEBUG: "True"
      USE_SQLITE_FALLBACK: "True"
      REDIS_URL: ""
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run Django system checks
        run: python manage.py check

      - name: Run Django tests
        run: python manage.py test --verbosity 1

  frontend:
    name: Frontend - ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: eduai
            test: false
          - app: edugames
            test: true
          - app: teacherbuddy
            test: true
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend build
        run: npm run build

      - name: Run frontend tests
        if: matrix.test == true
        run: npm test -- --run

  business-changes:
    name: Business site - detect changes
    runs-on: ubuntu-latest
    outputs:
      business: ${{ steps.filter.outputs.business }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether business/ changed
        id: filter
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            echo "business=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$base" "${{ github.sha }}" | grep -q '^business/'; then
            echo "business=true" >> "$GITHUB_OUTPUT"
          else
            echo "business=false" >> "$GITHUB_OUTPUT"
          fi

  business-backend:
    name: Business backend
    needs: business-changes
    if: needs.business-changes.outputs.business == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: business/backend
    env:
      DJANGO_DEBUG: "True"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: business/backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python manage.py test --verbosity 1

  business-site:
    name: Business site
    needs: business-changes
    if: needs.business-changes.outputs.business == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: business/site
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: business/site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test
