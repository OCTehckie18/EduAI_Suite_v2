# Shared by every portal's server block (the block sets `root`).

location = /healthz { access_log off; add_header Content-Type text/plain; return 200 "ok\n"; }

# Hashed build files never change under the same name, so browsers may keep them for a year.
location /assets/ {
  expires 1y;
  add_header Cache-Control "public, immutable";
  try_files $uri =404;
}

# The page itself must always be re-checked, so a new release shows at once.
location / {
  add_header Cache-Control "no-cache";
  try_files $uri /index.html;
}

location /api/ {
  proxy_pass http://api;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $forwarded_proto;
  proxy_read_timeout 90s;       # AI features and report downloads can take a while
  proxy_send_timeout 90s;
}

# Uploaded files are served by Django (it adds the right security headers).
location /uploads/ {
  proxy_pass http://api;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $forwarded_proto;
}

# Live games: websockets go to the realtime service.
location /ws/ {
  proxy_pass http://realtime;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $forwarded_proto;
  proxy_read_timeout 3600s;     # a game room stays open for the whole lesson
}

# Django admin and API browser assets (collected by the migrate step).
location /static/ {
  alias /srv/static/;
  expires 7d;
}
