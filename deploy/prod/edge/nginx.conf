worker_processes auto;
events { worker_connections 4096; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off;
  client_max_body_size 25m;   # submissions, rosters and OMR scans

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Whether the visitor used HTTPS: trust the TLS terminator in front of us, else our own scheme.
  map $http_x_forwarded_proto $forwarded_proto { default $http_x_forwarded_proto; "" $scheme; }
  map $http_upgrade $connection_upgrade { default upgrade; "" close; }

  upstream api { server web:8000; keepalive 32; }
  upstream realtime { server realtime:8001; }

  log_format main '$remote_addr "$request" $status $body_bytes_sent $request_time "$http_user_agent"';
  access_log /dev/stdout main;
  error_log /dev/stderr warn;

  include /etc/nginx/conf.d/*.conf;
}
