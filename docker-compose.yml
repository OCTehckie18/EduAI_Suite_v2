services:
  postgres:
    image: postgres:16-alpine
    container_name: eduai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: eduai_suite
      POSTGRES_USER: eduai
      POSTGRES_PASSWORD: eduai_dev_password
    ports:
      - "5432:5432"
    volumes:
      # Django owns this schema; keep it separate from legacy FastAPI/Mongo data.
      - postgres_data_django:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eduai -d eduai_suite"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: eduai_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: eduai_backend
    restart: unless-stopped
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-eduai-insecure-dev-secret-key-change-in-production}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-eduai-jwt-dev-secret-key}
      USE_SQLITE_FALLBACK: "False"
      DATABASE_URL: postgres://eduai:eduai_dev_password@postgres:5432/eduai_suite
      REDIS_URL: redis://redis:6379/0
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALENDAR_REDIRECT_URI: ${GOOGLE_CALENDAR_REDIRECT_URI:-http://localhost:8000/api/v1/auth/google-calendar/callback}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:5174,http://localhost:5175,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:5175
    volumes:
      - backend_media:/app/media
      - backend_uploads:/app/uploads
      - backend_local_uploads:/app/local_uploads
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

  eduai:
    build:
      context: ./apps
      dockerfile: eduai/Dockerfile
    container_name: eduai_master_admin
    restart: unless-stopped
    ports:
      - "5175:5175"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5175"]
      interval: 10s
      timeout: 5s
      retries: 12

  edugames:
    build:
      context: ./apps
      dockerfile: edugames/Dockerfile
    container_name: eduai_edugames
    restart: unless-stopped
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
      VITE_API_URL: http://localhost:8000/api/v1
      VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    env_file:
      - path: ./apps/edugames/.env
        required: false
    ports:
      - "5174:5174"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5174"]
      interval: 10s
      timeout: 5s
      retries: 12

  teacherbuddy:
    build:
      context: ./apps
      dockerfile: teacherbuddy/Dockerfile
    container_name: eduai_teacherbuddy
    restart: unless-stopped
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
      VITE_API_URL: http://localhost:8000/api/v1
      VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    env_file:
      - path: ./apps/teacherbuddy/.env
        required: false
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5173"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres_data_django:
  redis_data:
  backend_media:
  backend_uploads:
  backend_local_uploads:
