services:
  postgres:
    image: postgres:16-alpine
    container_name: eduai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: eduai_suite
      POSTGRES_USER: eduai
      POSTGRES_PASSWORD: eduai_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eduai -d eduai_suite"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: eduai_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: eduai_backend
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      USE_SQLITE_FALLBACK: "False"
      DATABASE_URL: postgres://eduai:eduai_dev_password@postgres:5432/eduai_suite
      REDIS_URL: redis://redis:6379/0
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:5174,http://localhost:5175
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

  eduai:
    build:
      context: ./apps
      dockerfile: eduai/Dockerfile
    container_name: eduai_master_admin
    restart: unless-stopped
    ports:
      - "5175:5175"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5175"]
      interval: 10s
      timeout: 5s
      retries: 12

  edugames:
    build:
      context: ./apps
      dockerfile: edugames/Dockerfile
    container_name: eduai_edugames
    restart: unless-stopped
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    env_file:
      - path: ./apps/edugames/.env
        required: false
    ports:
      - "5174:5174"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5174"]
      interval: 10s
      timeout: 5s
      retries: 12

  teacherbuddy:
    build:
      context: ./apps
      dockerfile: teacherbuddy/Dockerfile
    container_name: eduai_teacherbuddy
    restart: unless-stopped
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    env_file:
      - path: ./apps/teacherbuddy/.env
        required: false
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5173"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
  redis_data:
